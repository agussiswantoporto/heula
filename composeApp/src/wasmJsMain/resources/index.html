<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Heula">
    <meta name="theme-color" content="#F2F3F5">
    <title>Heula - Teman Puasa Berkala</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F2F3F5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
    <!-- Google Identity Services (GIS) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      window.heulaGoogleAuth = {
        clientId: '60875023761-ph4ha1o3p9anq05qikk5vgl2j3ct6opj.apps.googleusercontent.com',
        tokenClient: null,
        init: function() {
          if (window.google && window.google.accounts && window.google.accounts.oauth2) {
            this.tokenClient = google.accounts.oauth2.initTokenClient({
              client_id: this.clientId,
              scope: 'email profile openid',
              callback: (tokenResponse) => {
                window.heulaAuthActive = false;
                if (tokenResponse && tokenResponse.access_token) {
                  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { 'Authorization': 'Bearer ' + tokenResponse.access_token }
                  })
                  .then(function(res) { return res.json(); })
                  .then(function(data) {
                    var result = JSON.stringify({
                      uid: data.sub || '',
                      email: data.email || '',
                      displayName: data.name || '',
                      photoUrl: data.picture || ''
                    });
                    window.localStorage.setItem('heula_google_auth_result', result);
                  })
                  .catch(function(err) {
                    window.localStorage.setItem('heula_google_auth_result', '__ERR__:' + err.message);
                  });
                } else if (tokenResponse && tokenResponse.error) {
                  window.localStorage.setItem('heula_google_auth_result', '__CANCELLED__:' + tokenResponse.error);
                } else {
                  window.localStorage.setItem('heula_google_auth_result', '__CANCELLED__:empty_response');
                }
              },
              error_callback: function(error) {
                window.heulaAuthActive = false;
                console.warn('Google Identity error/cancel:', error);
                window.localStorage.setItem('heula_google_auth_result', '__CANCELLED__:' + (error && error.type ? error.type : 'error'));
              }
            });
          }
        },
        signIn: function() {
          try {
            window.localStorage.removeItem('heula_google_auth_result');
            window.heulaAuthActive = true;
            if (!this.tokenClient) {
              this.init();
            }
            if (this.tokenClient) {
              this.tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
              var self = this;
              setTimeout(function() {
                self.init();
                if (self.tokenClient) {
                  self.tokenClient.requestAccessToken({ prompt: 'consent' });
                } else {
                  window.heulaAuthActive = false;
                  window.localStorage.setItem('heula_google_auth_result', '__ERR__:Google Identity SDK belum siap.');
                }
              }, 400);
            }
          } catch (e) {
            window.heulaAuthActive = false;
            window.localStorage.setItem('heula_google_auth_result', '__ERR__:' + e.message);
          }
        },
        signOut: function() {
          try {
            window.heulaAuthActive = false;
            window.localStorage.removeItem('heula_google_auth_result');
          } catch (e) {}
        }
      };

      // Detect return to window/app if user dismissed popup outside callback
      window.addEventListener('focus', function() {
        if (window.heulaAuthActive) {
          setTimeout(function() {
            if (window.heulaAuthActive && !window.localStorage.getItem('heula_google_auth_result')) {
              window.heulaAuthActive = false;
              window.localStorage.setItem('heula_google_auth_result', '__CANCELLED__:focus_returned');
            }
          }, 2500);
        }
      });

      window.heulaFirestore = {
        projectId: 'heula-514007',
        upload: function(uid, email, displayName, photoUrl, jsonStr) {
          var url = 'https://firestore.googleapis.com/v1/projects/' + this.projectId + '/databases/(default)/documents/users/' + uid + '?updateMask.fieldPaths=payload&updateMask.fieldPaths=updatedAt&updateMask.fieldPaths=email&updateMask.fieldPaths=displayName&updateMask.fieldPaths=photoUrl';
          fetch(url, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fields: {
                email: { stringValue: email || '' },
                displayName: { stringValue: displayName || '' },
                photoUrl: { stringValue: photoUrl || '' },
                payload: { stringValue: jsonStr },
                updatedAt: { integerValue: String(Date.now()) }
              }
            })
          })
          .then(function(res) {
            if (!res.ok) throw new Error('Firestore error ' + res.status);
            window.localStorage.setItem('heula_sync_upload_status', 'OK');
          })
          .catch(function(err) {
            window.localStorage.setItem('heula_sync_upload_status', 'ERR:' + err.message);
          });
        },
        download: function(uid) {
          var url = 'https://firestore.googleapis.com/v1/projects/' + this.projectId + '/databases/(default)/documents/users/' + uid;
          fetch(url)
          .then(function(res) {
            if (res.status === 404) {
              window.localStorage.setItem('heula_sync_download_result', '__EMPTY__');
              return null;
            }
            if (!res.ok) throw new Error('Firestore read error ' + res.status);
            return res.json();
          })
          .then(function(doc) {
            if (!doc) return;
            if (!doc.fields || !doc.fields.payload) {
              window.localStorage.setItem('heula_sync_download_result', '__EMPTY__');
            } else {
              window.localStorage.setItem('heula_sync_download_result', doc.fields.payload.stringValue);
            }
          })
          .catch(function(err) {
            window.localStorage.setItem('heula_sync_download_result', '__ERR__:' + err.message);
          });
        }
      };

      window.heulaShareImage = {
        renderCanvas: function(session, config) {
          var isStory = !config || config.aspectRatio !== 'SQUARE';
          var W = 1080;
          var H = isStory ? 1920 : 1080;

          var canvas = document.createElement('canvas');
          canvas.width = W;
          canvas.height = H;
          var ctx = canvas.getContext('2d');

          // 100% Pure Transparent Alpha Background
          ctx.clearRect(0, 0, W, H);

          // Universal RoundRect helper
          function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
          }

          // Strava Mark Helper (Athletic double chevron)
          function drawStravaMark(x, y, size, color) {
            ctx.save();
            ctx.fillStyle = color;
            var w = size * 0.72;
            var h = size;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.5, y);
            ctx.lineTo(x + w, y + h * 0.52);
            ctx.lineTo(x + w * 0.72, y + h * 0.52);
            ctx.lineTo(x + w * 0.5, y + h * 0.26);
            ctx.lineTo(x + w * 0.28, y + h * 0.52);
            ctx.lineTo(x, y + h * 0.52);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.5, y + h * 0.44);
            ctx.lineTo(x + w * 0.86, y + h);
            ctx.lineTo(x + w * 0.64, y + h);
            ctx.lineTo(x + w * 0.5, y + h * 0.74);
            ctx.lineTo(x + w * 0.36, y + h);
            ctx.lineTo(x + w * 0.14, y + h);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }

          // Compute time formats
          var durMs = session.durationMs || (session.endMs - session.startMs) || 0;
          var totalMin = Math.floor(durMs / 60000);
          var hours = Math.floor(totalMin / 60);
          var mins = totalMin % 60;
          function pad(n) { return (n < 10 ? '0' : '') + n; }
          var durMinsStr = pad(mins);
          var durFormatted = hours + ':' + durMinsStr;

          var startDate = new Date(session.startMs || Date.now());
          var endDate = new Date(session.endMs || Date.now());
          var startStr = pad(startDate.getHours()) + ':' + pad(startDate.getMinutes());
          var endStr = pad(endDate.getHours()) + ':' + pad(endDate.getMinutes());

          var monthNames = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'JUL', 'AGS', 'SEP', 'OKT', 'NOV', 'DES'];
          var dateStr = endDate.getDate() + ' ' + monthNames[endDate.getMonth()] + ' ' + endDate.getFullYear();

          var template = config.template || 'MODERN_GRADIENT';
          var mainColor = config.textColorHex || '#FFFFFF';
          var planLabel = session.planLabel || '16:8';

          var centerX = W / 2;
          var centerY = isStory ? 960 : 540;
          var s = isStory ? 1.0 : 0.85;

          var sansFont = 'system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Inter", "Helvetica Neue", sans-serif';
          var serifFont = '"Playfair Display", "Georgia", "Times New Roman", serif';

          function drawStatsRow(x, y, w, col1Title, col1Val, col2Title, col2Val, col3Title, col3Val, textColor, subColor, divColor, sVal) {
            var colW = w / 3;
            var c1 = x + colW * 0.5;
            var c2 = x + colW * 1.5;
            var c3 = x + colW * 2.5;

            if (divColor) {
              ctx.strokeStyle = divColor;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(x + colW, y - 10 * sVal);
              ctx.lineTo(x + colW, y + 45 * sVal);
              ctx.moveTo(x + colW * 2, y - 10 * sVal);
              ctx.lineTo(x + colW * 2, y + 45 * sVal);
              ctx.stroke();
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '700 ' + Math.round(18 * sVal) + 'px ' + sansFont;
            ctx.fillStyle = subColor;
            ctx.fillText(col1Title, c1, y);
            ctx.font = '800 ' + Math.round(36 * sVal) + 'px ' + sansFont;
            ctx.fillStyle = textColor;
            ctx.fillText(col1Val, c1, y + 34 * sVal);

            ctx.font = '700 ' + Math.round(18 * sVal) + 'px ' + sansFont;
            ctx.fillStyle = subColor;
            ctx.fillText(col2Title, c2, y);
            ctx.font = '800 ' + Math.round(36 * sVal) + 'px ' + sansFont;
            ctx.fillStyle = textColor;
            ctx.fillText(col2Val, c2, y + 34 * sVal);

            ctx.font = '700 ' + Math.round(18 * sVal) + 'px ' + sansFont;
            ctx.fillStyle = subColor;
            ctx.fillText(col3Title, c3, y);
            ctx.font = '800 ' + Math.round(36 * sVal) + 'px ' + sansFont;
            ctx.fillStyle = textColor;
            ctx.fillText(col3Val, c3, y + 34 * sVal);
          }

          ctx.save();

          if (template === 'MINIMALIST') {
            // 1. MINIMALIST — Strava Athletic Pure Overlay (No Box)
            var blockW = 840 * s;
            var startX = centerX - blockW / 2;
            var curY = centerY - 190 * s;

            // Header
            if (config.showBranding) {
              drawStravaMark(startX, curY - 14 * s, 32 * s, '#FC5200');
              ctx.textAlign = 'left';
              ctx.textBaseline = 'middle';
              ctx.font = '900 ' + Math.round(30 * s) + 'px ' + sansFont;
              ctx.fillStyle = mainColor;
              ctx.fillText('HEULA', startX + 34 * s, curY + 2 * s);

              ctx.textAlign = 'right';
              ctx.font = '700 ' + Math.round(18 * s) + 'px ' + sansFont;
              ctx.fillStyle = 'rgba(255,255,255,0.75)';
              ctx.fillText('INTERMITTENT FASTING', startX + blockW, curY + 2 * s);
              curY += 38 * s;
            }

            // Top hairline
            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(startX, curY);
            ctx.lineTo(startX + blockW, curY);
            ctx.stroke();
            curY += 50 * s;

            // Hero
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '800 ' + Math.round(20 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FC5200';
            ctx.fillText('WAKTU BERPUASA', centerX, curY);
            curY += 100 * s;

            // Giant duration with shadow
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 18;
            ctx.font = '900 ' + Math.round(185 * s) + 'px ' + sansFont;
            ctx.fillStyle = mainColor;
            ctx.fillText(hours + 'h ' + durMinsStr + 'm', centerX, curY);
            ctx.shadowBlur = 0;
            curY += 105 * s;

            // Bottom hairline
            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(startX, curY);
            ctx.lineTo(startX + blockW, curY);
            ctx.stroke();
            curY += 45 * s;

            // 3-column stats row
            if (config.showTarget || config.showTimes) {
              drawStatsRow(
                startX, curY, blockW,
                'POLA', planLabel,
                'MULAI', startStr,
                'SELESAI', endStr,
                mainColor, 'rgba(255,255,255,0.6)', 'rgba(255,255,255,0.22)', s
              );
              curY += 80 * s;
            }

            // Footer
            if (config.showDate) {
              ctx.textAlign = 'center';
              ctx.font = '700 ' + Math.round(20 * s) + 'px ' + sansFont;
              ctx.fillStyle = 'rgba(255,255,255,0.85)';
              ctx.fillText(dateStr + '  •  TARGET PUASA TUNTAS ✓', centerX, curY + 15 * s);
            }

          } else if (template === 'MODERN_GRADIENT') {
            // 2. MODERN_GRADIENT — Strava Iconic Activity Card
            var cardW = 860 * s;
            var cardH = 500 * s;
            var cardX = centerX - cardW / 2;
            var cardY = centerY - cardH / 2;

            // Frosted Card
            ctx.fillStyle = 'rgba(16, 18, 22, 0.90)';
            roundRect(cardX, cardY, cardW, cardH, 36 * s);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            var curY = cardY + 50 * s;

            // Header
            if (config.showBranding) {
              drawStravaMark(cardX + 45 * s, curY - 14 * s, 30 * s, '#FC5200');
              ctx.textAlign = 'left';
              ctx.textBaseline = 'middle';
              ctx.font = '900 ' + Math.round(28 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.fillText('HEULA', cardX + 85 * s, curY + 2 * s);
            }

            // Pill badge: FASTING COMPLETED
            var pillW = 220 * s;
            var pillH = 42 * s;
            var pillX = cardX + cardW - 45 * s - pillW;
            var pillY = curY - pillH / 2;
            var grad = ctx.createLinearGradient(pillX, 0, pillX + pillW, 0);
            grad.addColorStop(0, '#FC5200');
            grad.addColorStop(1, '#FF7A00');
            ctx.fillStyle = grad;
            roundRect(pillX, pillY, pillW, pillH, pillH / 2);
            ctx.fill();
            ctx.textAlign = 'center';
            ctx.font = '800 ' + Math.round(17 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('✓ TARGET TUNTAS', pillX + pillW / 2, curY + 1 * s);

            curY += 65 * s;

            // Hero duration
            ctx.textAlign = 'center';
            ctx.font = '700 ' + Math.round(19 * s) + 'px ' + sansFont;
            ctx.fillStyle = 'rgba(255,255,255,0.65)';
            ctx.fillText('TOTAL WAKTU BERPUASA', centerX, curY);

            curY += 85 * s;
            ctx.font = '900 ' + Math.round(155 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(durFormatted, centerX, curY);

            curY += 80 * s;
            // Divider
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cardX + 45 * s, curY);
            ctx.lineTo(cardX + cardW - 45 * s, curY);
            ctx.stroke();

            curY += 45 * s;
            // Stats 3-column
            var statsW = cardW - 90 * s;
            var statsX = cardX + 45 * s;
            drawStatsRow(
              statsX, curY, statsW,
              'POLA', planLabel,
              'MULAI', startStr,
              'SELESAI', endStr,
              '#FFFFFF', 'rgba(255,255,255,0.55)', 'rgba(255,255,255,0.12)', s
            );

            if (config.showDate) {
              curY += 85 * s;
              ctx.textAlign = 'center';
              ctx.font = '600 ' + Math.round(19 * s) + 'px ' + sansFont;
              ctx.fillStyle = 'rgba(255,255,255,0.45)';
              ctx.fillText(dateStr, centerX, curY);
            }

          } else if (template === 'DARK_MODE') {
            // 3. DARK_MODE — Strava Stealth Matte Black Edition
            var cardW = 860 * s;
            var cardH = 500 * s;
            var cardX = centerX - cardW / 2;
            var cardY = centerY - cardH / 2;

            ctx.fillStyle = 'rgba(10, 11, 14, 0.95)';
            roundRect(cardX, cardY, cardW, cardH, 36 * s);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            var curY = cardY + 50 * s;

            // Header with accent bar
            ctx.fillStyle = '#FC5200';
            roundRect(cardX + 45 * s, curY - 14 * s, 6 * s, 28 * s, 3 * s);
            ctx.fill();

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = '900 ' + Math.round(22 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('INTERMITTENT FASTING', cardX + 62 * s, curY + 1 * s);

            ctx.textAlign = 'right';
            ctx.font = '800 ' + Math.round(20 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FC5200';
            ctx.fillText('HEULA PRO', cardX + cardW - 45 * s, curY + 1 * s);

            curY += 75 * s;

            // Hero duration
            ctx.textAlign = 'center';
            ctx.font = '900 ' + Math.round(155 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(hours + 'j ' + durMinsStr + 'm', centerX, curY);

            curY += 70 * s;
            // Green Status Pill
            var statusW = 340 * s;
            var statusH = 40 * s;
            var statusX = centerX - statusW / 2;
            var statusY = curY - statusH / 2;
            ctx.fillStyle = 'rgba(52, 199, 89, 0.16)';
            roundRect(statusX, statusY, statusW, statusH, 20 * s);
            ctx.fill();
            ctx.strokeStyle = 'rgba(52, 199, 89, 0.38)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.font = '800 ' + Math.round(18 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#34C759';
            ctx.fillText('● 100% TARGET PUASA TUNTAS', centerX, curY + 1 * s);

            curY += 55 * s;
            // Divider
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cardX + 45 * s, curY);
            ctx.lineTo(cardX + cardW - 45 * s, curY);
            ctx.stroke();

            curY += 45 * s;
            // 3 Boxed Mini Pills
            var colW = (cardW - 120 * s) / 3;
            var labels = ['POLA', 'MULAI', 'SELESAI'];
            var vals = [planLabel, startStr, endStr];
            for (var i = 0; i < 3; i++) {
              var bx = cardX + 45 * s + i * (colW + 15 * s);
              var by = curY - 10 * s;
              var bh = 76 * s;
              ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
              roundRect(bx, by, colW, bh, 18 * s);
              ctx.fill();
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
              ctx.lineWidth = 1;
              ctx.stroke();

              ctx.textAlign = 'center';
              ctx.font = '700 ' + Math.round(16 * s) + 'px ' + sansFont;
              ctx.fillStyle = 'rgba(255, 255, 255, 0.50)';
              ctx.fillText(labels[i], bx + colW / 2, by + 22 * s);
              ctx.font = '800 ' + Math.round(28 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.fillText(vals[i], bx + colW / 2, by + 52 * s);
            }

          } else if (template === 'GLASS_STYLE') {
            // 4. GLASS_STYLE — Apple Fitness / Strava Frosted Liquid Glass
            var cardW = 860 * s;
            var cardH = 500 * s;
            var cardX = centerX - cardW / 2;
            var cardY = centerY - cardH / 2;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
            roundRect(cardX, cardY, cardW, cardH, 40 * s);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
            ctx.lineWidth = 2;
            ctx.stroke();

            var curY = cardY + 52 * s;

            // Frosted Pill Header
            var pillW = 280 * s;
            var pillH = 42 * s;
            var pillX = cardX + 45 * s;
            var pillY = curY - pillH / 2;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            roundRect(pillX, pillY, pillW, pillH, 21 * s);
            ctx.fill();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '800 ' + Math.round(18 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('⚡ HEULA ATHLETICS', pillX + pillW / 2, curY + 1 * s);

            if (config.showDate) {
              ctx.textAlign = 'right';
              ctx.font = '700 ' + Math.round(19 * s) + 'px ' + sansFont;
              ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
              ctx.fillText(dateStr, cardX + cardW - 45 * s, curY + 1 * s);
            }

            curY += 75 * s;

            // Giant duration
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.35)';
            ctx.shadowBlur = 12;
            ctx.font = '900 ' + Math.round(155 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(hours + 'h ' + durMinsStr + 'm', centerX, curY);
            ctx.shadowBlur = 0;

            curY += 68 * s;
            ctx.font = '700 ' + Math.round(22 * s) + 'px ' + sansFont;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.90)';
            ctx.fillText('Target ' + planLabel + ' Selesai Sempurna', centerX, curY);

            curY += 45 * s;
            // Glass Pill stats container
            var statBoxW = cardW - 80 * s;
            var statBoxH = 88 * s;
            var statBoxX = centerX - statBoxW / 2;
            var statBoxY = curY;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            roundRect(statBoxX, statBoxY, statBoxW, statBoxH, 24 * s);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.lineWidth = 1;
            ctx.stroke();

            drawStatsRow(
              statBoxX, statBoxY + 28 * s, statBoxW,
              'POLA', planLabel,
              'MULAI', startStr,
              'SELESAI', endStr,
              '#FFFFFF', 'rgba(255, 255, 255, 0.70)', 'rgba(255, 255, 255, 0.18)', s
            );

          } else if (template === 'TYPOGRAPHY') {
            // 5. TYPOGRAPHY — Nike / Strava Big Athletic Poster
            var blockW = 840 * s;
            var startX = centerX - blockW / 2;
            var curY = centerY - 175 * s;

            // Accent line + Title
            ctx.fillStyle = '#FC5200';
            roundRect(startX, curY - 14 * s, 6 * s, 32 * s, 3 * s);
            ctx.fill();

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = '900 ' + Math.round(24 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FC5200';
            ctx.fillText('HEULA // FASTING MILESTONE', startX + 18 * s, curY + 2 * s);

            curY += 75 * s;

            // Giant number 16 + stacked texts
            var numStr = String(hours);
            ctx.font = '900 ' + Math.round(220 * s) + 'px ' + sansFont;
            var numW = ctx.measureText(numStr).width;

            ctx.fillStyle = mainColor;
            ctx.shadowColor = 'rgba(0,0,0,0.55)';
            ctx.shadowBlur = 15;
            ctx.fillText(numStr, startX, curY + 50 * s);
            ctx.shadowBlur = 0;

            var stackX = startX + numW + 28 * s;
            ctx.font = '900 ' + Math.round(52 * s) + 'px ' + sansFont;
            ctx.fillStyle = mainColor;
            ctx.fillText('JAM BERPUASA', stackX, curY + 20 * s);

            ctx.font = '800 ' + Math.round(44 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FC5200';
            ctx.fillText('+ ' + durMinsStr + ' MENIT', stackX, curY + 80 * s);

            curY += 190 * s;

            // Thick accent divider
            ctx.fillStyle = '#FC5200';
            ctx.fillRect(startX, curY, blockW, 4 * s);

            curY += 40 * s;

            // Tabular stats
            drawStatsRow(
              startX, curY, blockW,
              'TARGET', planLabel,
              'WAKTU', startStr + ' → ' + endStr,
              'TANGGAL', dateStr,
              mainColor, 'rgba(255,255,255,0.6)', 'rgba(255,255,255,0.22)', s
            );

          } else if (template === 'EDITORIAL') {
            // 6. EDITORIAL — Strava Summit & Tracksmith Editorial Journal
            var cardW = 860 * s;
            var cardH = 500 * s;
            var cardX = centerX - cardW / 2;
            var cardY = centerY - cardH / 2;

            ctx.fillStyle = 'rgba(14, 15, 18, 0.92)';
            roundRect(cardX, cardY, cardW, cardH, 32 * s);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.20)';
            ctx.lineWidth = 1;
            ctx.stroke();

            var curY = cardY + 50 * s;

            // Header
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '400 ' + Math.round(22 * s) + 'px ' + serifFont;
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.fillText('—  HEULA ATHLETIC JOURNAL  —', centerX, curY);

            curY += 38 * s;
            ctx.font = '600 ' + Math.round(16 * s) + 'px ' + sansFont;
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.fillText('VOLUME 24  •  ' + dateStr, centerX, curY);

            curY += 80 * s;
            ctx.font = '300 ' + Math.round(150 * s) + 'px ' + serifFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(hours + 'h ' + durMinsStr + 'm', centerX, curY);

            curY += 75 * s;
            ctx.font = 'italic 400 ' + Math.round(24 * s) + 'px ' + serifFont;
            ctx.fillStyle = 'rgba(255,255,255,0.80)';
            ctx.fillText('Aktivitas Berpuasa Terverifikasi', centerX, curY);

            curY += 45 * s;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.moveTo(cardX + 60 * s, curY);
            ctx.lineTo(cardX + cardW - 60 * s, curY);
            ctx.stroke();

            curY += 42 * s;
            drawStatsRow(
              cardX + 60 * s, curY, cardW - 120 * s,
              'POLA', planLabel,
              'MULAI', startStr,
              'SELESAI', endStr,
              '#FFFFFF', 'rgba(255,255,255,0.50)', 'rgba(255,255,255,0.15)', s
            );

          } else if (template === 'NEON') {
            // 7. NEON — Strava Night Run / Cyber Volt
            var cardW = 860 * s;
            var cardH = 500 * s;
            var cardX = centerX - cardW / 2;
            var cardY = centerY - cardH / 2;

            ctx.fillStyle = 'rgba(10, 12, 16, 0.94)';
            roundRect(cardX, cardY, cardW, cardH, 36 * s);
            ctx.fill();
            ctx.strokeStyle = '#CCFF00';
            ctx.lineWidth = 2;
            ctx.stroke();

            var curY = cardY + 50 * s;

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = '900 ' + Math.round(24 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#CCFF00';
            ctx.fillText('⚡ HEULA NIGHT FAST', cardX + 45 * s, curY);

            ctx.textAlign = 'right';
            ctx.font = '800 ' + Math.round(20 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#00F0FF';
            ctx.fillText('RECORD: UNLOCKED', cardX + cardW - 45 * s, curY);

            curY += 80 * s;

            // Glowing main duration
            ctx.textAlign = 'center';
            ctx.shadowColor = '#CCFF00';
            ctx.shadowBlur = 22;
            ctx.font = '900 ' + Math.round(160 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(durFormatted, centerX, curY);
            ctx.shadowBlur = 0;

            curY += 70 * s;
            ctx.font = '800 ' + Math.round(22 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#CCFF00';
            ctx.fillText('TARGET ' + planLabel + ' COMPLETED', centerX, curY);

            curY += 50 * s;
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cardX + 45 * s, curY);
            ctx.lineTo(cardX + cardW - 45 * s, curY);
            ctx.stroke();

            curY += 45 * s;
            drawStatsRow(
              cardX + 45 * s, curY, cardW - 90 * s,
              'POLA', planLabel,
              'MULAI', startStr,
              'SELESAI', endStr,
              '#FFFFFF', '#CCFF00', 'rgba(0, 240, 255, 0.30)', s
            );

          } else {
            // 8. CLEAN_WHITE — Pure White Floating Athletic Overlay
            var blockW = 840 * s;
            var startX = centerX - blockW / 2;
            var curY = centerY - 190 * s;

            if (config.showBranding) {
              drawStravaMark(startX, curY - 14 * s, 32 * s, '#FFFFFF');
              ctx.textAlign = 'left';
              ctx.textBaseline = 'middle';
              ctx.font = '900 ' + Math.round(30 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.shadowColor = 'rgba(0,0,0,0.6)';
              ctx.shadowBlur = 10;
              ctx.fillText('HEULA', startX + 34 * s, curY + 2 * s);

              ctx.textAlign = 'right';
              ctx.font = '700 ' + Math.round(18 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.fillText('FASTING ACTIVITY', startX + blockW, curY + 2 * s);
              curY += 38 * s;
            }

            ctx.strokeStyle = 'rgba(255,255,255,0.40)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(startX, curY);
            ctx.lineTo(startX + blockW, curY);
            ctx.stroke();
            curY += 50 * s;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '800 ' + Math.round(20 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 8;
            ctx.fillText('DURASI BERPUASA', centerX, curY);
            curY += 100 * s;

            ctx.shadowBlur = 16;
            ctx.font = '900 ' + Math.round(185 * s) + 'px ' + sansFont;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(hours + 'h ' + durMinsStr + 'm', centerX, curY);
            curY += 105 * s;

            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.40)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(startX, curY);
            ctx.lineTo(startX + blockW, curY);
            ctx.stroke();
            curY += 45 * s;

            ctx.shadowBlur = 8;
            drawStatsRow(
              startX, curY, blockW,
              'POLA', planLabel,
              'MULAI', startStr,
              'SELESAI', endStr,
              '#FFFFFF', 'rgba(255,255,255,0.80)', 'rgba(255,255,255,0.35)', s
            );
            curY += 80 * s;

            if (config.showDate) {
              ctx.textAlign = 'center';
              ctx.font = '700 ' + Math.round(20 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.fillText(dateStr + '  •  TARGET TUNTAS ✓', centerX, curY + 15 * s);
            }
          }

          ctx.restore();
          return canvas;
        },

        renderBase64Png: function(sessionJson, configJson) {
          try {
            var session = JSON.parse(sessionJson || '{}');
            var config = JSON.parse(configJson || '{}');
            var canvas = window.heulaShareImage.renderCanvas(session, config);
            var dataUrl = canvas.toDataURL('image/png');
            return dataUrl.split(',')[1] || '';
          } catch(e) {
            console.error('renderBase64Png error:', e);
            return '';
          }
        },

        dataUrlToBlob: function(dataUrl) {
          var parts = dataUrl.split(',');
          var byteString = atob(parts[1]);
          var ia = new Uint8Array(byteString.length);
          for (var i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
          }
          return new Blob([ia], { type: 'image/png' });
        },

        exportImage: function(sessionJson, configJson) {
          try {
            var session = JSON.parse(sessionJson || '{}');
            var config = JSON.parse(configJson || '{}');
            var canvas = window.heulaShareImage.renderCanvas(session, config);

            // Compute time formats for notification text
            var durMs = session.durationMs || (session.endMs - session.startMs) || 0;
            var totalMin = Math.floor(durMs / 60000);
            var hours = Math.floor(totalMin / 60);
            var mins = totalMin % 60;
            var durFormatted = hours + ' JAM ' + mins + ' MENIT';

            var dataUrl = canvas.toDataURL('image/png');
            var blob = window.heulaShareImage.dataUrlToBlob(dataUrl);
            var fileName = 'heula-fast-' + Date.now() + '.png';

            var file = null;
            try {
              file = new File([blob], fileName, { type: 'image/png' });
            } catch (e) {
              file = null;
            }

            var canShare = false;
            try {
              if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
                canShare = true;
              }
            } catch (e) {
              canShare = false;
            }

            if (canShare && navigator.share) {
              navigator.share({
                files: [file],
                title: 'Jejak Puasa Heula',
                text: 'Saya baru saja menyelesaikan puasa ' + durFormatted + ' dengan Heula!'
              })
              .then(function() {
                window.localStorage.setItem('heula_share_export_status', 'OK');
              })
              .catch(function(err) {
                if (err && err.name !== 'AbortError') {
                  window.heulaShareImage.triggerDownload(blob, fileName);
                }
                window.localStorage.setItem('heula_share_export_status', 'OK');
              });
            } else {
              window.heulaShareImage.triggerDownload(blob, fileName);
              window.localStorage.setItem('heula_share_export_status', 'OK');
            }
          } catch (e) {
            console.error('Share export error:', e);
            window.localStorage.setItem('heula_share_export_status', 'ERR:' + (e.message || 'Gagal ekspor'));
          }
        },

        triggerDownload: function(blob, fileName) {
          try {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
          } catch (e) {
            console.error('triggerDownload error:', e);
          }
        }
      };
    </script>
