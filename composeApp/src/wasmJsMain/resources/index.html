<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Heula">
    <meta name="theme-color" content="#F2F3F5">
    <title>Heula - Teman Puasa Berkala</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F2F3F5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
    <!-- Google Identity Services (GIS) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      window.heulaGoogleAuth = {
        clientId: '60875023761-ph4ha1o3p9anq05qikk5vgl2j3ct6opj.apps.googleusercontent.com',
        tokenClient: null,
        init: function() {
          if (window.google && window.google.accounts && window.google.accounts.oauth2) {
            this.tokenClient = google.accounts.oauth2.initTokenClient({
              client_id: this.clientId,
              scope: 'email profile openid',
              callback: (tokenResponse) => {
                window.heulaAuthActive = false;
                if (tokenResponse && tokenResponse.access_token) {
                  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { 'Authorization': 'Bearer ' + tokenResponse.access_token }
                  })
                  .then(function(res) { return res.json(); })
                  .then(function(data) {
                    var result = JSON.stringify({
                      uid: data.sub || '',
                      email: data.email || '',
                      displayName: data.name || '',
                      photoUrl: data.picture || ''
                    });
                    window.localStorage.setItem('heula_google_auth_result', result);
                  })
                  .catch(function(err) {
                    window.localStorage.setItem('heula_google_auth_result', '__ERR__:' + err.message);
                  });
                } else if (tokenResponse && tokenResponse.error) {
                  window.localStorage.setItem('heula_google_auth_result', '__CANCELLED__:' + tokenResponse.error);
                } else {
                  window.localStorage.setItem('heula_google_auth_result', '__CANCELLED__:empty_response');
                }
              },
              error_callback: function(error) {
                window.heulaAuthActive = false;
                console.warn('Google Identity error/cancel:', error);
                window.localStorage.setItem('heula_google_auth_result', '__CANCELLED__:' + (error && error.type ? error.type : 'error'));
              }
            });
          }
        },
        signIn: function() {
          try {
            window.localStorage.removeItem('heula_google_auth_result');
            window.heulaAuthActive = true;
            if (!this.tokenClient) {
              this.init();
            }
            if (this.tokenClient) {
              this.tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
              var self = this;
              setTimeout(function() {
                self.init();
                if (self.tokenClient) {
                  self.tokenClient.requestAccessToken({ prompt: 'consent' });
                } else {
                  window.heulaAuthActive = false;
                  window.localStorage.setItem('heula_google_auth_result', '__ERR__:Google Identity SDK belum siap.');
                }
              }, 400);
            }
          } catch (e) {
            window.heulaAuthActive = false;
            window.localStorage.setItem('heula_google_auth_result', '__ERR__:' + e.message);
          }
        },
        signOut: function() {
          try {
            window.heulaAuthActive = false;
            window.localStorage.removeItem('heula_google_auth_result');
          } catch (e) {}
        }
      };

      // Detect return to window/app if user dismissed popup outside callback
      window.addEventListener('focus', function() {
        if (window.heulaAuthActive) {
          setTimeout(function() {
            if (window.heulaAuthActive && !window.localStorage.getItem('heula_google_auth_result')) {
              window.heulaAuthActive = false;
              window.localStorage.setItem('heula_google_auth_result', '__CANCELLED__:focus_returned');
            }
          }, 2500);
        }
      });

      window.heulaFirestore = {
        projectId: 'heula-514007',
        upload: function(uid, email, displayName, photoUrl, jsonStr) {
          var url = 'https://firestore.googleapis.com/v1/projects/' + this.projectId + '/databases/(default)/documents/users/' + uid + '?updateMask.fieldPaths=payload&updateMask.fieldPaths=updatedAt&updateMask.fieldPaths=email&updateMask.fieldPaths=displayName&updateMask.fieldPaths=photoUrl';
          fetch(url, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fields: {
                email: { stringValue: email || '' },
                displayName: { stringValue: displayName || '' },
                photoUrl: { stringValue: photoUrl || '' },
                payload: { stringValue: jsonStr },
                updatedAt: { integerValue: String(Date.now()) }
              }
            })
          })
          .then(function(res) {
            if (!res.ok) throw new Error('Firestore error ' + res.status);
            window.localStorage.setItem('heula_sync_upload_status', 'OK');
          })
          .catch(function(err) {
            window.localStorage.setItem('heula_sync_upload_status', 'ERR:' + err.message);
          });
        },
        download: function(uid) {
          var url = 'https://firestore.googleapis.com/v1/projects/' + this.projectId + '/databases/(default)/documents/users/' + uid;
          fetch(url)
          .then(function(res) {
            if (res.status === 404) {
              window.localStorage.setItem('heula_sync_download_result', '__EMPTY__');
              return null;
            }
            if (!res.ok) throw new Error('Firestore read error ' + res.status);
            return res.json();
          })
          .then(function(doc) {
            if (!doc) return;
            if (!doc.fields || !doc.fields.payload) {
              window.localStorage.setItem('heula_sync_download_result', '__EMPTY__');
            } else {
              window.localStorage.setItem('heula_sync_download_result', doc.fields.payload.stringValue);
            }
          })
          .catch(function(err) {
            window.localStorage.setItem('heula_sync_download_result', '__ERR__:' + err.message);
          });
        }
      };

      window.heulaShareImage = {
        exportImage: function(sessionJson, configJson) {
          try {
            var session = JSON.parse(sessionJson || '{}');
            var config = JSON.parse(configJson || '{}');

            var isStory = config.aspectRatio === 'STORY';
            var W = 1080;
            var H = isStory ? 1920 : 1080;

            var canvas = document.createElement('canvas');
            canvas.width = W;
            canvas.height = H;
            var ctx = canvas.getContext('2d');

            // 100% Pure Transparent Alpha Background
            ctx.clearRect(0, 0, W, H);

            // Universal RoundRect helper compatible with all browsers & WebKit versions
            function roundRect(x, y, w, h, r) {
              ctx.beginPath();
              ctx.moveTo(x + r, y);
              ctx.lineTo(x + w - r, y);
              ctx.quadraticCurveTo(x + w, y, x + w, y + r);
              ctx.lineTo(x + w, y + h - r);
              ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
              ctx.lineTo(x + r, y + h);
              ctx.quadraticCurveTo(x, y + h, x, y + h - r);
              ctx.lineTo(x, y + r);
              ctx.quadraticCurveTo(x, y, x + r, y);
              ctx.closePath();
            }

            // Compute time formats - matching Kotlin logic 1:1
            var durMs = session.durationMs || (session.endMs - session.startMs) || 0;
            var totalMin = Math.floor(durMs / 60000);
            var hours = Math.floor(totalMin / 60);
            var mins = totalMin % 60;
            function pad(n) { return (n < 10 ? '0' : '') + n; }
            var durMinsStr = pad(mins);
            var durFormatted = hours + ':' + durMinsStr;

            var startDate = new Date(session.startMs || Date.now());
            var endDate = new Date(session.endMs || Date.now());
            var startStr = pad(startDate.getHours()) + ':' + pad(startDate.getMinutes());
            var endStr = pad(endDate.getHours()) + ':' + pad(endDate.getMinutes());

            var monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            var dateStr = endDate.getDate() + ' ' + monthNames[endDate.getMonth()] + ' ' + endDate.getFullYear();

            var template = config.template || 'MODERN_GRADIENT';
            var mainColor = config.textColorHex || '#FFFFFF';
            var planLabel = session.planLabel || '16:8';

            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            var centerX = W / 2;
            var centerY = isStory ? (H * 0.48) : (H * 0.50);
            var s = isStory ? 1.0 : 0.82; // Scaling factor for 1:1 vs 9:16

            var sansFont = 'system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Inter", Roboto, sans-serif';
            var serifFont = '"Playfair Display", "Georgia", "Times New Roman", serif';

            if (template === 'MINIMALIST') {
              var baseY = centerY - (130 * s);

              if (config.showBranding) {
                ctx.font = '700 ' + Math.round(28 * s) + 'px ' + sansFont;
                ctx.fillStyle = mainColor;
                ctx.shadowColor = 'rgba(0,0,0,0.35)';
                ctx.shadowBlur = 8;
                ctx.fillText('H  E  U  L  A', centerX, baseY);
                baseY += (70 * s);
              }

              ctx.font = '900 ' + Math.round(175 * s) + 'px ' + sansFont;
              ctx.fillStyle = mainColor;
              ctx.shadowColor = 'rgba(0,0,0,0.4)';
              ctx.shadowBlur = 12;
              ctx.fillText(durFormatted, centerX, baseY + (75 * s));
              baseY += (175 * s);

              ctx.font = '700 ' + Math.round(28 * s) + 'px ' + sansFont;
              ctx.fillStyle = mainColor;
              ctx.fillText('JAM BERPUASA', centerX, baseY);
              baseY += (45 * s);

              // Thin divider line
              ctx.shadowBlur = 0;
              ctx.fillStyle = mainColor;
              ctx.fillRect(centerX - (60 * s), baseY, 120 * s, 3 * s);
              baseY += (40 * s);

              if (config.showTarget) {
                ctx.font = '600 ' + Math.round(28 * s) + 'px ' + sansFont;
                ctx.fillStyle = mainColor;
                ctx.fillText('Target ' + planLabel + ' • Selesai', centerX, baseY);
                baseY += (45 * s);
              }
              if (config.showTimes) {
                ctx.font = '400 ' + Math.round(25 * s) + 'px ' + sansFont;
                ctx.fillStyle = mainColor;
                ctx.globalAlpha = 0.85;
                ctx.fillText(startStr + ' — ' + endStr, centerX, baseY);
                ctx.globalAlpha = 1.0;
                baseY += (40 * s);
              }
              if (config.showDate) {
                ctx.font = '400 ' + Math.round(23 * s) + 'px ' + sansFont;
                ctx.fillStyle = mainColor;
                ctx.globalAlpha = 0.65;
                ctx.fillText(dateStr, centerX, baseY);
                ctx.globalAlpha = 1.0;
              }

            } else if (template === 'MODERN_GRADIENT') {
              var curY = centerY - (180 * s);

              // Top Pill Badge
              if (config.showBranding) {
                var pillW = 320 * s;
                var pillH = 64 * s;
                var pillX = centerX - pillW / 2;
                var pillY = curY;

                var grad = ctx.createLinearGradient(pillX, 0, pillX + pillW, 0);
                grad.addColorStop(0, '#FC5200');
                grad.addColorStop(1, '#FF7A00');
                ctx.fillStyle = grad;
                roundRect(pillX, pillY, pillW, pillH, pillH / 2);
                ctx.fill();

                ctx.font = '800 ' + Math.round(24 * s) + 'px ' + sansFont;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText('FASTING ACTIVE', centerX, pillY + pillH / 2);
                curY += (100 * s);
              }

              // Giant Duration
              ctx.font = '900 ' + Math.round(180 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.shadowColor = 'rgba(0,0,0,0.5)';
              ctx.shadowBlur = 16;
              ctx.fillText(durFormatted, centerX, curY + (75 * s));
              curY += (175 * s);

              // Subtitle
              ctx.font = '800 ' + Math.round(30 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FC5200';
              ctx.shadowBlur = 0;
              ctx.fillText('BERHASIL BERPUASA', centerX, curY);
              curY += (55 * s);

              // Secondary Metrics Card
              var cardW = 640 * s;
              var cardH = 130 * s;
              var cardX = centerX - cardW / 2;
              var cardY = curY;

              ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
              roundRect(cardX, cardY, cardW, cardH, 24 * s);
              ctx.fill();
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
              ctx.lineWidth = 1.5;
              ctx.stroke();

              // Two columns inside card
              var col1X = cardX + (cardW * 0.28);
              var col2X = cardX + (cardW * 0.72);

              if (config.showTarget) {
                ctx.font = '600 ' + Math.round(18 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillText('POLA', col1X, cardY + (38 * s));
                ctx.font = '800 ' + Math.round(32 * s) + 'px ' + sansFont;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(planLabel, col1X, cardY + (82 * s));
              }

              if (config.showTimes) {
                ctx.font = '600 ' + Math.round(18 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillText('WAKTU', col2X, cardY + (38 * s));
                ctx.font = '800 ' + Math.round(30 * s) + 'px ' + sansFont;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(startStr + ' – ' + endStr, col2X, cardY + (82 * s));
              }

              curY += cardH + (40 * s);

              if (config.showDate) {
                ctx.font = '500 ' + Math.round(24 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.fillText(dateStr, centerX, curY);
              }

            } else if (template === 'GLASS_STYLE') {
              var cardW = 720 * s;
              var cardH = 480 * s;
              var cardX = centerX - cardW / 2;
              var cardY = centerY - cardH / 2;

              ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
              roundRect(cardX, cardY, cardW, cardH, 40 * s);
              ctx.fill();
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
              ctx.lineWidth = 2.5;
              ctx.stroke();

              var innerY = cardY + (60 * s);
              if (config.showBranding) {
                ctx.font = '700 ' + Math.round(26 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillText('H E U L A   F A S T I N G', centerX, innerY);
                innerY += (85 * s);
              }

              ctx.font = '900 ' + Math.round(135 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.shadowColor = 'rgba(0,0,0,0.3)';
              ctx.shadowBlur = 10;
              ctx.fillText(hours + 'j ' + durMinsStr + 'm', centerX, innerY);
              innerY += (105 * s);

              ctx.shadowBlur = 0;
              if (config.showTarget) {
                ctx.font = '600 ' + Math.round(28 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillText('Target ' + planLabel + ' Tuntas', centerX, innerY);
                innerY += (55 * s);
              }
              if (config.showTimes) {
                ctx.font = '400 ' + Math.round(25 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.fillText(startStr + ' — ' + endStr, centerX, innerY);
                innerY += (45 * s);
              }
              if (config.showDate) {
                ctx.font = '400 ' + Math.round(23 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fillText(dateStr, centerX, innerY);
              }

            } else if (template === 'TYPOGRAPHY') {
              var startX = centerX - (360 * s);
              var curY = centerY - (160 * s);
              ctx.textAlign = 'left';

              if (config.showBranding) {
                ctx.font = '900 ' + Math.round(30 * s) + 'px ' + sansFont;
                ctx.fillStyle = mainColor;
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 8;
                ctx.fillText('FASTING RECORD', startX, curY);
                curY += (70 * s);
              }

              // Big number
              var numFont = '900 ' + Math.round(210 * s) + 'px ' + sansFont;
              ctx.font = numFont;
              ctx.fillStyle = mainColor;
              var numText = String(hours);
              ctx.fillText(numText, startX, curY + (85 * s));

              // Measure width of the big number to place JAM and MIN precisely
              var numWidth = ctx.measureText(numText).width;
              var labelX = startX + numWidth + (20 * s);

              ctx.font = '800 ' + Math.round(48 * s) + 'px ' + sansFont;
              ctx.fillText('JAM', labelX, curY + (45 * s));
              ctx.fillText(durMinsStr + ' MNT', labelX, curY + (115 * s));
              curY += (210 * s);

              ctx.shadowBlur = 0;
              if (config.showTarget || config.showTimes) {
                ctx.font = '700 ' + Math.round(30 * s) + 'px ' + sansFont;
                ctx.fillStyle = mainColor;
                ctx.fillText(planLabel + ' • ' + startStr + ' — ' + endStr, startX, curY);
                curY += (50 * s);
              }
              if (config.showDate) {
                ctx.font = '500 ' + Math.round(24 * s) + 'px ' + sansFont;
                ctx.fillStyle = mainColor;
                ctx.globalAlpha = 0.75;
                ctx.fillText(dateStr, startX, curY);
                ctx.globalAlpha = 1.0;
              }

            } else if (template === 'EDITORIAL') {
              var curY = centerY - (140 * s);

              if (config.showBranding) {
                ctx.font = '400 ' + Math.round(28 * s) + 'px ' + serifFont;
                ctx.fillStyle = mainColor;
                ctx.fillText('— HEULA JOURNAL —', centerX, curY);
                curY += (80 * s);
              }

              ctx.font = '300 ' + Math.round(145 * s) + 'px ' + serifFont;
              ctx.fillStyle = mainColor;
              ctx.shadowColor = 'rgba(0,0,0,0.35)';
              ctx.shadowBlur = 10;
              ctx.fillText(hours + 'h ' + durMinsStr + 'm', centerX, curY + (60 * s));
              curY += (150 * s);

              ctx.shadowBlur = 0;
              ctx.font = 'italic ' + Math.round(30 * s) + 'px ' + serifFont;
              ctx.fillStyle = mainColor;
              ctx.fillText('Intermittent Fasting Completed', centerX, curY);
              curY += (45 * s);

              // Thin line
              ctx.fillStyle = mainColor;
              ctx.fillRect(centerX - (60 * s), curY, 120 * s, 2 * s);
              curY += (40 * s);

              if (config.showTarget) {
                ctx.font = '400 ' + Math.round(26 * s) + 'px ' + sansFont;
                ctx.fillStyle = mainColor;
                ctx.fillText('Target: ' + planLabel, centerX, curY);
                curY += (45 * s);
              }
              if (config.showDate) {
                ctx.font = '400 ' + Math.round(23 * s) + 'px ' + sansFont;
                ctx.fillStyle = mainColor;
                ctx.globalAlpha = 0.7;
                ctx.fillText(dateStr, centerX, curY);
                ctx.globalAlpha = 1.0;
              }

            } else if (template === 'NEON') {
              var curY = centerY - (150 * s);

              if (config.showBranding) {
                ctx.font = '900 ' + Math.round(28 * s) + 'px ' + sansFont;
                ctx.fillStyle = '#CCFF00';
                ctx.shadowColor = '#CCFF00';
                ctx.shadowBlur = 14;
                ctx.fillText('// HEULA.PRO', centerX, curY);
                curY += (75 * s);
              }

              ctx.font = '900 ' + Math.round(175 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.shadowColor = '#CCFF00';
              ctx.shadowBlur = 20;
              ctx.fillText(durFormatted, centerX, curY + (75 * s));
              curY += (175 * s);

              ctx.font = '800 ' + Math.round(30 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#CCFF00';
              ctx.shadowBlur = 10;
              ctx.fillText('FASTING GOAL UNLOCKED', centerX, curY);
              curY += (55 * s);

              ctx.shadowBlur = 0;
              if (config.showTarget) {
                ctx.font = '800 ' + Math.round(28 * s) + 'px ' + sansFont;
                ctx.fillStyle = '#00F0FF';
                ctx.fillText('TARGET ' + planLabel, centerX, curY);
                curY += (48 * s);
              }
              if (config.showTimes) {
                ctx.font = '500 ' + Math.round(25 * s) + 'px ' + sansFont;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(startStr + ' — ' + endStr, centerX, curY);
                curY += (42 * s);
              }
              if (config.showDate) {
                ctx.font = '400 ' + Math.round(23 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText(dateStr, centerX, curY);
              }

            } else if (template === 'DARK_MODE') {
              var cardW = 720 * s;
              var cardH = 480 * s;
              var cardX = centerX - cardW / 2;
              var cardY = centerY - cardH / 2;

              ctx.fillStyle = 'rgba(18, 18, 20, 0.90)';
              roundRect(cardX, cardY, cardW, cardH, 40 * s);
              ctx.fill();
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
              ctx.lineWidth = 2;
              ctx.stroke();

              var innerY = cardY + (60 * s);
              if (config.showBranding) {
                ctx.font = '800 ' + Math.round(24 * s) + 'px ' + sansFont;
                ctx.fillStyle = '#FC5200';
                ctx.fillText('HEULA ACTIVITY', centerX, innerY);
                innerY += (85 * s);
              }

              ctx.font = '900 ' + Math.round(135 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.fillText(hours + 'j ' + durMinsStr + 'm', centerX, innerY);
              innerY += (95 * s);

              ctx.font = '700 ' + Math.round(30 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#34C759';
              ctx.fillText('Target ' + planLabel + ' Selesai', centerX, innerY);
              innerY += (60 * s);

              if (config.showTimes) {
                ctx.font = '400 ' + Math.round(26 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText(startStr + ' — ' + endStr, centerX, innerY);
                innerY += (45 * s);
              }
              if (config.showDate) {
                ctx.font = '400 ' + Math.round(23 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillText(dateStr, centerX, innerY);
              }

            } else {
              // CLEAN_WHITE: Pure white text with soft shadow for universal readability
              var curY = centerY - (120 * s);

              if (config.showBranding) {
                ctx.font = '700 ' + Math.round(28 * s) + 'px ' + sansFont;
                ctx.fillStyle = '#FFFFFF';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.fillText('H  E  U  L  A', centerX, curY);
                curY += (70 * s);
              }

              ctx.font = '900 ' + Math.round(175 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.shadowColor = 'rgba(0,0,0,0.55)';
              ctx.shadowBlur = 14;
              ctx.fillText(durFormatted, centerX, curY + (75 * s));
              curY += (175 * s);

              ctx.font = '700 ' + Math.round(28 * s) + 'px ' + sansFont;
              ctx.fillStyle = '#FFFFFF';
              ctx.shadowBlur = 8;
              ctx.fillText('TARGET ' + planLabel + ' COMPLETED', centerX, curY);
              curY += (55 * s);

              ctx.shadowBlur = 6;
              if (config.showTimes) {
                ctx.font = '400 ' + Math.round(26 * s) + 'px ' + sansFont;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(startStr + ' — ' + endStr, centerX, curY);
                curY += (45 * s);
              }
              if (config.showDate) {
                ctx.font = '400 ' + Math.round(23 * s) + 'px ' + sansFont;
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.fillText(dateStr, centerX, curY);
              }
            }

            ctx.restore();

            // Export to Transparent PNG
            canvas.toBlob(function(blob) {
              if (!blob) {
                window.localStorage.setItem('heula_share_export_status', 'ERR:Gagal membuat blob gambar');
                return;
              }

              var fileName = 'heula-fast-' + Date.now() + '.png';
              var file = new File([blob], fileName, { type: 'image/png' });

              // Web Share API on Mobile (iOS / Android)
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                  files: [file],
                  title: 'Jejak Puasa Heula',
                  text: 'Saya baru saja menyelesaikan puasa ' + durFormatted + ' dengan Heula!'
                })
                .then(function() {
                  window.localStorage.setItem('heula_share_export_status', 'OK');
                })
                .catch(function(err) {
                  // User cancelled share or failed
                  if (err.name !== 'AbortError') {
                    // Fallback to download
                    window.heulaShareImage.triggerDownload(blob, fileName);
                  }
                  window.localStorage.setItem('heula_share_export_status', 'OK');
                });
              } else {
                // Direct download fallback
                window.heulaShareImage.triggerDownload(blob, fileName);
                window.localStorage.setItem('heula_share_export_status', 'OK');
              }
            }, 'image/png');

          } catch (e) {
            console.error('Share export error:', e);
            window.localStorage.setItem('heula_share_export_status', 'ERR:' + e.message);
          }
        },

        triggerDownload: function(blob, fileName) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
        }
      };
    </script>
</head>
<body>
    <script src="composeApp.js"></script>
</body>
</html>
