# ==============================================================================
# Heula KMP - Environment & API Configuration Template
# ==============================================================================
# Salin file ini menjadi 'local.properties' atau 'config.properties'
# KOSONGKAN/JANGAN simpan kredensial rahasia di dalam VCS/Git publik.
# ==============================================================================

# --- Google Cloud & OAuth 2.0 Credentials ---
# Dapatkan dari Google Cloud Console > APIs & Services > Credentials
GOOGLE_WEB_CLIENT_ID=
GOOGLE_WEB_CLIENT_SECRET=
GOOGLE_ANDROID_CLIENT_ID=
GOOGLE_IOS_CLIENT_ID=

# --- Android App Signing Fingerprints ---
# Debug Keystore: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android
ANDROID_PACKAGE_NAME=id.heula
ANDROID_DEBUG_SHA1=
ANDROID_RELEASE_SHA1=

# --- Firebase & Cloud Firestore ---
# Dapatkan dari Firebase Console > Project Settings (General)
FIREBASE_PROJECT_ID=
FIREBASE_PROJECT_NUMBER=
FIREBASE_DATABASE_ID=(default)
FIREBASE_API_KEY=
FIREBASE_AUTH_DOMAIN=
FIREBASE_STORAGE_BUCKET=

# --- Production Deployment Domains ---
WEB_PRODUCTION_URL=
